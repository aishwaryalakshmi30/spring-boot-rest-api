<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Account Details</h2>

    <div class="form-group">
        <label>Holder Name</label>
        <input type="text" id="holderName" placeholder="Enter holder name">
    </div>

    <div class="form-group">
        <label>Balance</label>
        <input type="number" id="balance" placeholder="Enter balance">
    </div>

    <button onclick="saveData()">Save</button>

    <table>
        <thead>
        <tr>
            <th>S.No</th>
            <th>Holder Name</th>
            <th>Balance</th>
        </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>
    </table>

</div>

<script>

    async function saveData() {

        const holderName = document.getElementById("holderName").value;
        const balance = document.getElementById("balance").value;

        if (holderName === "" || balance === "") {
            alert("Please enter Holder Name and Balance");
            return;
        }

        const account = {
            holderName: holderName,
            balance: Number(balance)
        };

        try {

            const response = await fetch("/accounts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(account)
            });

            if (response.ok) {

                alert("Account Saved Successfully!");

                document.getElementById("holderName").value = "";
                document.getElementById("balance").value = "";

                loadAccounts();

            } else {
                alert("Failed to save account");
            }

        } catch (error) {
            console.error(error);
            alert("Could not connect to Spring Boot");
        }
    }


    async function loadAccounts() {

        try {

            const response = await fetch("/accounts");

            const accounts = await response.json();

            const tableBody = document.getElementById("tableBody");

            tableBody.innerHTML = "";

            accounts.forEach((account, index) => {

                const row = tableBody.insertRow();

                row.insertCell(0).innerText = index + 1;
                row.insertCell(1).innerText = account.holderName;
                row.insertCell(2).innerText = "₹ " + account.balance;

            });

        } catch (error) {

            console.error(error);
            alert("Could not load accounts");

        }
    }


    // Load accounts when page opens
    loadAccounts();

</script>

</body>
</html>
